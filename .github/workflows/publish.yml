# Builds every version directory as a multi-arch image and pushes it
# to Docker Hub and ghcr. A push to main and the monthly schedule
# publish, which also refreshes older maintained versions on the
# current base image. A manual workflow_dispatch defaults to a dry
# run (build without pushing) unless its push input is set.

name: Publish

on:
  push:
    branches: [main]
    paths:
      - "*/Dockerfile"
      - ".github/workflows/publish.yml"
  schedule:
    # Monthly rebuild so base image security fixes reach all tags.
    - cron: "17 4 2 * *"
  workflow_dispatch:
    inputs:
      push:
        description: Push the built images to the registries
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  enumerate:
    runs-on: ubuntu-24.04
    outputs:
      directories: ${{ steps.list.outputs.directories }}
      newest: ${{ steps.list.outputs.newest }}
    steps:
      - uses: actions/checkout@v6
      - name: List version directories
        id: list
        run: |
          directories=$(find . -maxdepth 2 -name Dockerfile -path './[0-9]*' \
            | cut -d/ -f2 | sort -V)
          [ -n "$directories" ] || { echo "::error::no version directories found"; exit 1; }
          echo "directories=$(echo "$directories" | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
          echo "newest=$(echo "$directories" | tail -n 1)" >> "$GITHUB_OUTPUT"

  publish:
    needs: enumerate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Everything pushes except a manual dry run.
      SHOULD_PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.enumerate.outputs.directories) }}
    steps:
      - uses: actions/checkout@v6

      - name: Read version and derive tags
        id: meta
        env:
          DIRECTORY: ${{ matrix.directory }}
          NEWEST: ${{ needs.enumerate.outputs.newest }}
        run: |
          version=$(sed -n 's/^ENV KOJA_VERSION=\(.*\)$/\1/p' "$DIRECTORY/Dockerfile")
          if [ -z "$version" ]; then
            echo "::error::could not read KOJA_VERSION from $DIRECTORY/Dockerfile"
            exit 1
          fi
          tags="kojalang/koja:$version
          kojalang/koja:$DIRECTORY
          ghcr.io/koja-lang/koja:$version
          ghcr.io/koja-lang/koja:$DIRECTORY"
          if [ "$DIRECTORY" = "$NEWEST" ]; then
            tags="$tags
          kojalang/koja:latest
          ghcr.io/koja-lang/koja:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to ghcr
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.directory }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
