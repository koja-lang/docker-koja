# Builds the multi-arch image and pushes it to Docker Hub and ghcr.
# A push to main that touches the Dockerfile publishes. A manual
# workflow_dispatch is a dry run: it builds both platforms without
# pushing.

name: Publish

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Read Koja version from Dockerfile
        id: version
        run: |
          version=$(sed -n 's/^ARG KOJA_VERSION=\(.*\)$/\1/p' Dockerfile)
          if [ -z "$version" ]; then
            echo "::error::could not read KOJA_VERSION from Dockerfile"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            kojalang/koja:${{ steps.version.outputs.version }}
            kojalang/koja:${{ steps.version.outputs.minor }}
            kojalang/koja:latest
            ghcr.io/koja-lang/koja:${{ steps.version.outputs.version }}
            ghcr.io/koja-lang/koja:${{ steps.version.outputs.minor }}
            ghcr.io/koja-lang/koja:latest
